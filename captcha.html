<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vestel CAPTCHA</title>
<style>
  :root { --bg: #1f212a; --border: rgba(255, 255, 255, 0.08); --primary: #2563eb; --text-main: #f3f4f6; --text-muted: #9ca3af; --danger: #ef4444; --success: #10b981; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  .captcha-widget { width: 320px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); box-sizing: border-box; }
  .loading-state { display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--text-muted); font-size: 14px; padding: 8px 0; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-state { display: none; color: var(--danger); font-size: 13px; font-weight: 500; align-items: center; justify-content: center; gap: 8px; padding: 8px 0; text-align: center; }
  .verify-state { display: none; flex-direction: column; }
  .verify-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .verify-header img { height: 18px; object-fit: contain; filter: brightness(0) invert(1); opacity: 0.9; }
  .verify-header span { font-size: 13px; color: var(--text-main); font-weight: 500; }
  .verify-question { font-size: 20px; font-weight: 700; text-align: center; color: var(--text-main); background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 8px; letter-spacing: 1px; margin-bottom: 12px; }
  .verify-input-group { display: flex; flex-direction: column; gap: 8px; }
  .verify-input-group input { width: 100%; padding: 10px 12px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); text-align: center; outline: none; font-size: 14px; transition: border 0.2s; }
  .verify-input-group input:focus { border-color: var(--primary); }
  .verify-btn { width: 100%; padding: 10px; background: var(--primary); border: none; border-radius: 6px; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
  .verify-btn:hover { background: #1d4ed8; }
  .success-state { display: none; color: var(--success); font-size: 14px; font-weight: 500; align-items: center; justify-content: center; gap: 8px; padding: 8px 0; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .shake { animation: shake 0.3s ease; border-color: var(--danger) !important; }
</style>
</head>
<body>

  <div class="captcha-widget" id="captchaWidget">
    <div class="loading-state" id="loadingState"><div class="spinner"></div><span>Güvenlik kontrolü...</span></div>
    <div class="error-state" id="errorState">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span id="errorMsg">Hata</span>
    </div>
    <div class="verify-state" id="verifyState">
      <div class="verify-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Vestel_logo.svg/512px-Vestel_logo.svg.png" alt="Vestel" onerror="this.style.display='none'">
        <span>Robot değilim</span>
      </div>
      <div class="verify-question" id="wQuestion">... + ... = ?</div>
      <div class="verify-input-group">
        <input type="text" id="wAnswer" placeholder="Cevabı buraya yazın" autocomplete="off">
        <button class="verify-btn" onclick="checkAnswer()">Onayla</button>
      </div>
    </div>
    <div class="success-state" id="successState">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      <span>Doğrulandı!</span>
    </div>
  </div>

  <script>
    // Ana siteye yüklendi sinyali gönder
    if (window.parent !== window) {
      window.parent.postMessage({ type: "CAPTCHA_LOADED" }, "*");
    }

    // =========================================================
    // ÇOK ÖNEMLİ DÜZELTME: RAW GITHUB LİNKİ KULLANIYORUZ
    // =========================================================
    const GITHUB_KEY_JSON_URL = "https://raw.githubusercontent.com/scptr1155-gif/roblozx/main/keys.json";
    
    const urlParams = new URLSearchParams(window.location.search);
    const siteKey = urlParams.get('key'); 
    let correctAnswer = 0;

    document.addEventListener("DOMContentLoaded", async () => {
      await validateKey();
    });

    async function validateKey() {
      if (!siteKey) return showError("Key eksik!");
      
      try {
        // Cache engellemek için rastgele parametre ekliyoruz
        const res = await fetch(GITHUB_KEY_JSON_URL + "?nocache=" + Math.random());
        
        if (!res.ok) {
            throw new Error("Dosya bulunamadı (HTTP " + res.status + ")");
        }

        const data = await res.json();
        
        const keyData = data.keys.find(k => k.siteKey === siteKey);
        if (!keyData) return showError("Geçersiz Key!");
        
        const expireDate = new Date(keyData.expires);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        expireDate.setHours(0, 0, 0, 0);
        if (today > expireDate) return showError("Süresi dolmuş!");

        document.getElementById("loadingState").style.display = "none";
        document.getElementById("verifyState").style.display = "flex";
        generateQuestion();
      } catch (e) {
        // Hatanın ne olduğunu ekrana yazdır
        showError("Sunucuya ulaşılamadı: " + e.message);
      }
    }

    function showError(msg) {
      document.getElementById("loadingState").style.display = "none";
      document.getElementById("verifyState").style.display = "none";
      document.getElementById("errorState").style.display = "flex";
      document.getElementById("errorMsg").textContent = msg;
      document.getElementById("captchaWidget").classList.add("shake");
    }

    function generateQuestion() {
      const n1 = Math.floor(Math.random() * 10) + 1;
      const n2 = Math.floor(Math.random() * 10) + 1;
      correctAnswer = n1 + n2;
      document.getElementById("wQuestion").textContent = `${n1} + ${n2} = ?`;
      document.getElementById("wAnswer").value = "";
      document.getElementById("wAnswer").addEventListener("keypress", (e) => { if (e.key === "Enter") checkAnswer(); });
      setTimeout(() => document.getElementById("wAnswer").focus(), 100);
    }

    function checkAnswer() {
      const val = parseInt(document.getElementById("wAnswer").value.trim());
      if (val === correctAnswer) {
        document.getElementById("verifyState").style.display = "none";
        document.getElementById("successState").style.display = "flex";
        if (window.parent !== window) {
          setTimeout(() => { window.parent.postMessage({ type: "CAPTCHA_SUCCESS", siteKey: siteKey }, "*"); }, 600);
        }
      } else {
        const input = document.getElementById("wAnswer");
        input.value = "";
        input.classList.add("shake");
        setTimeout(() => input.classList.remove("shake"), 300);
      }
    }
  </script>
</body>
</html>
